{% extends "layout.html" %}

{% block title %}
    Homepage
{% endblock %}

{% block content %}
    <div class="centralize">
        <h1 class="margin">Set your timer</h1>
        <form method="post">
            <div class="mb-3">
                <label for="minutes">Focus Time</label>
                <input class="form-control rounded" name="minutes" type="number" value="25">
            </div>
            <div class="mb-3">
                <label for="interval">Break Time</label>
                <input name="interval" type="number" value="5" class="form-control rounded">
            </div>
            <div class="mb-3">
                <label for="bigInter">Big Interval</label>
                <input name="bigInter" type="number" value="10" class="form-control rounded">
            </div>   
            <div>
                <input class="btn btn-primary w-100" type="submit" value="Start">
            </div>
        </form>
    </div>
{% endblock %}
