{% extends "layout.html" %}

{% block title %}
Counting
{% endblock %}

{% block content %}
<div class="timer centralize"
    data-minutes ="{{ minutes }}"
    data-interval ="{{ interval }}"

</div>

<script src="{{ url_for('static', filename='Timer.js') }}?v=1"></script>
{% endblock %}
